server {
  listen 80;
  client_max_body_size 500m;
  location /api/ { proxy_pass http://backend:8000; proxy_http_version 1.1; proxy_set_header Host $host; }
  location /ws/ { proxy_pass http://backend:8000; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection "upgrade"; }
  location / { proxy_pass http://frontend:80; }
}
