apiVersion: apps/v1
kind: Deployment
metadata:
  name: petroedge-backend
  namespace: petroedge
spec:
  replicas: 2
  selector:
    matchLabels:
      app: petroedge-backend
  template:
    metadata:
      labels:
        app: petroedge-backend
    spec:
      containers:
        - name: backend
          image: petroedge-ai-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: petroedge-config
            - secretRef:
                name: petroedge-secret
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: petroedge-backend
  namespace: petroedge
spec:
  selector:
    app: petroedge-backend
  ports:
    - name: http
      port: 8000
      targetPort: 8000

