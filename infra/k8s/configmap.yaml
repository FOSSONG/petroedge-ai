apiVersion: v1
kind: ConfigMap
metadata:
  name: petroedge-config
  namespace: petroedge
data:
  APP_NAME: "PetroEdge AI"
  ENVIRONMENT: "cloud"
  API_HOST: "0.0.0.0"
  API_PORT: "8000"
  JWT_ALGORITHM: "HS256"
  ACCESS_TOKEN_EXPIRE_MINUTES: "60"
  CORS_ORIGINS: "http://localhost:3000"
  KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
  REDIS_URL: "redis://redis:6379/0"
  MLFLOW_TRACKING_URI: "http://mlflow:5000"

