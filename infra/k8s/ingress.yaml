apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: petroedge-ingress
  namespace: petroedge
spec:
  rules:
    - host: petroedge.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: petroedge-frontend
                port:
                  number: 80
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: petroedge-backend
                port:
                  number: 8000

