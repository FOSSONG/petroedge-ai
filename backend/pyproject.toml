[build-system]
requires = ["setuptools>=69.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "petroedge-ai-backend"
version = "0.2.0"
description = "Deployable, model-agnostic FastAPI platform for real-time well-log analytics."
requires-python = ">=3.11,<3.13"
dependencies = [
    "matplotlib==3.10.3",
  "alembic>=1.13.0",
  "fastapi>=0.111.0",
  "joblib>=1.4.0",
  "lasio>=0.31",
  "numpy>=1.26.0,<3",
  "pandas>=2.2.0",
  "argon2-cffi>=23.1.0,<26.0.0",
  "pydantic-settings>=2.3.0",
  "python-jose[cryptography]>=3.3.0",
  "python-multipart>=0.0.9",
  "sqlalchemy>=2.0.0",
  "uvicorn[standard]>=0.30.0",
  "scikit-learn>=1.5.0",
  "xgboost>=2.1.0,<4",
  "openpyxl>=3.1.5",
  "reportlab>=4.2.0",
]

[project.optional-dependencies]
tree-models = [
  "xgboost>=2.1.0",
  "lightgbm>=4.5.0",
  "catboost>=1.2.7",
]

explainability = [
  "shap>=0.46.0",
]

onnx = [
  "onnx>=1.16.0",
  "onnxruntime>=1.19.0",
  "skl2onnx>=1.17.0",
]

experiments = [
  "mlflow>=2.14.0",
]

streaming = [
  "aiokafka>=0.10.0",
  "redis>=5.0.0",
]

deep-learning = [
  "torch>=2.3.0",
  "tensorflow>=2.16.0",
]

distributed = [
  "dask[dataframe,distributed]>=2025.1.0",
  "ray[data]>=2.40.0",
  "polars>=1.20.0",
  "pyarrow>=18.0.0",
]

postgres = [
  "psycopg[binary]>=3.2.0",
]


reports = [
  "openpyxl>=3.1.5",
  "reportlab>=4.2.0",
]

dev = [
  "httpx>=0.27.0",
  "pytest>=8.2.0",
  "pytest-asyncio>=0.23.0",
  "ruff>=0.5.0",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["app", "app.*"]
exclude = [
  "data",
  "data.*",
  "models",
  "models.*",
  "alembic",
  "alembic.*",
  "model_store",
  "model_store.*",
  "dataset_store",
  "dataset_store.*",
  "experiment_store",
  "experiment_store.*",
  "tests",
  "tests.*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"