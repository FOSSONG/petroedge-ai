[project]
name = "petroedge-ai-backend"
version = "0.1.0"
description = "FastAPI backend for PetroEdge AI well logging analytics."
requires-python = ">=3.11"
dependencies = [
  "aiokafka>=0.10.0",
  "fastapi>=0.111.0",
  "mlflow>=2.14.0",
  "numpy>=1.26.0",
  "pandas>=2.2.0",
  "passlib[bcrypt]>=1.7.4",
  "psycopg[binary]>=3.2.0",
  "pydantic-settings>=2.3.0",
  "pyotp>=2.9.0",
  "python-jose[cryptography]>=3.3.0",
  "python-multipart>=0.0.9",
  "redis>=5.0.0",
  "reportlab>=4.2.0",
  "scikit-learn>=1.5.0",
  "sqlalchemy>=2.0.0",
  "tensorflow>=2.16.0",
  "torch>=2.3.0",
  "uvicorn[standard]>=0.30.0"
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27.0",
  "pytest>=8.2.0",
  "pytest-asyncio>=0.23.0",
  "ruff>=0.5.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

