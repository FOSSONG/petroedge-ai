services:
  backend:
    build: ./backend
    container_name: petroedge-mvp-backend
    env_file:
      - ./backend/.env
    ports:
      - "8000:8000"
    volumes:
      - ./backend/data:/app/data
      - ./backend/dataset_store:/app/dataset_store
      - ./backend/model_store:/app/model_store
      - ./backend/experiment_store:/app/experiment_store
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 20s
      timeout: 8s
      retries: 5
      start_period: 30s

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: /api/v1
    container_name: petroedge-mvp-frontend
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy

