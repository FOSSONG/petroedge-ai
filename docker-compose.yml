name: petroedge-release45

services:
  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: sqlite:////app/data/petroedge.db
      PETROEDGE_RUN_MIGRATIONS: "false"
    command: ["alembic", "upgrade", "head"]
    volumes:
      - ./backend/data:/app/data
    restart: "no"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: sqlite:////app/data/petroedge.db
      PETROEDGE_RUN_MIGRATIONS: "false"
    ports:
      - "8000:8000"
    volumes:
      - ./backend/data:/app/data
      - ./backend/dataset_store:/app/dataset_store
      - ./backend/model_store:/app/model_store
      - ./backend/experiment_store:/app/experiment_store
      - ./backend/prediction_store:/app/prediction_store
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import json,urllib.request; payload=json.load(urllib.request.urlopen('http://127.0.0.1:8000/health',timeout=5)); raise SystemExit(0 if payload.get('status') in ('ok','degraded') else 1)"
      interval: 15s
      timeout: 8s
      retries: 10
      start_period: 45s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api/v1
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped